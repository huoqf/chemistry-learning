name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (architecture checks)
        run: npm run lint

      - name: Lint (oxlint, zero-warning gate)
        run: npx oxlint --max-warnings 0

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload dist
        if: matrix.node-version == 22 && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 页面级渲染验证（审查项 G4）：E2E 原本无任何自动触发，白屏/路由 404/
  # 三屏结构缺失/考点内容丢失只有人工跑才能发现。现纳入 CI（单 Node 版本 + chromium）。
  e2e:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (页面渲染 + 考点锚点)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
